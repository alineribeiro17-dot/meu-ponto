<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meu Ponto - QR Code de acesso</title>
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<style>
  body { margin: 0; font-family: Arial, Helvetica, sans-serif; background: #FCF3EA; color: #3A2A30; text-align: center; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 32px 20px; }
  h1 { color: #CF4173; font-size: 28px; margin: 0 0 8px; }
  p { font-size: 18px; line-height: 1.5; margin: 8px 0; }
  .qr { background: #fff; display: inline-block; padding: 18px; border-radius: 18px; margin: 18px 0;
        box-shadow: 0 2px 12px rgba(0,0,0,.08); border: 3px solid #CF4173; }
  .qr svg { display: block; width: 300px; height: 300px; }
  .aviso { background: #FBE9D4; color: #7A4A12; border-radius: 12px; padding: 12px; font-size: 15px; margin-top: 16px; }
  .erro { background: #FBE4EC; color: #A8325D; border-radius: 12px; padding: 14px; font-size: 17px; margin: 12px 0; }
  .ok { background: #E4F1EA; color: #2D6B4F; border-radius: 12px; padding: 12px; font-size: 17px; margin: 12px 0; }
  .card { background: #fff; border-radius: 16px; padding: 18px; text-align: left; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  label { display: block; font-size: 16px; margin-bottom: 6px; color: #5D3140; }
  input { width: 100%; box-sizing: border-box; font-size: 20px; padding: 12px; border: 1px solid #E2CFD5; border-radius: 10px; letter-spacing: 1px; }
  button { width: 100%; margin-top: 12px; padding: 14px; font-size: 18px; border: 0; border-radius: 12px; background: #CF4173;
           color: #fff; font-weight: bold; cursor: pointer; }
  .dica { font-size: 14px; color: #8E7D83; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Meu Ponto</h1>
  <div id="conteudo"></div>
</div>
<script src="config.js"></script>
<script src="qrcode.js"></script>
<script>
  (function () {
    var el = document.getElementById('conteudo');
    var h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
    var api = h.get('a') || window.PONTO_API_PADRAO || '';
    var base = location.href.split('#')[0].replace(/qr\.html.*$/, '');
    function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function formulario(msg) {
      el.innerHTML = (msg || '') +
        '<div class="card"><label><b>Chave de acesso</b></label>' +
        '<input id="ch" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Ex.: a1b2c3d4e5f6">' +
        '<div class="dica">Está na planilha, aba <b>Config</b>, linha <b>"Chave do app"</b>.</div>' +
        '<button id="gerar">Conferir e gerar QR Code</button></div>';
      document.getElementById('gerar').onclick = function () { conferir(document.getElementById('ch').value); };
    }

    function mostrarQr(chave, aviso) {
      var link = base + '#c=' + encodeURIComponent(chave) + (h.get('a') ? '&a=' + encodeURIComponent(h.get('a')) : '');
      var qr = qrcode(0, 'M'); qr.addData(link); qr.make();
      el.innerHTML = aviso +
        '<p><b>Aponte a câmera do celular para o código</b><br>e toque no link que aparecer.</p>' +
        '<div class="qr">' + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div>' +
        '<p>O app abre já ligado à planilha.<br>Depois é só tocar em <b>“Instalar o Meu Ponto”</b>.</p>' +
        '<div class="aviso">🔒 Este código dá acesso aos registros. Mostre só para quem vai usar o app e feche esta página depois.</div>';
    }

    function conferir(chave) {
      chave = String(chave || '').trim();
      if (!chave) return formulario('<div class="erro">Cole a chave de acesso.</div>');
      el.innerHTML = '<p>Conferindo a chave com a planilha...</p>';
      fetch(api, { method: 'POST', redirect: 'follow', body: JSON.stringify({ chave: chave, acao: 'estado', args: [] }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.ok) {
            var nome = j.dados && j.dados.apelido ? ' (' + esc(j.dados.apelido) + ')' : '';
            mostrarQr(chave, '<div class="ok">✅ Chave conferida com a planilha' + nome + '.</div>');
          } else {
            formulario('<div class="erro">❌ Essa chave não confere com a planilha. Copie de novo a chave da aba <b>Config</b>, linha <b>"Chave do app"</b>, e cole aqui.</div>');
          }
        })
        .catch(function () {
          mostrarQr(chave, '<div class="erro">⚠️ Não consegui conferir a chave agora (sem conexão com a planilha). Confira se ela está igual à da aba Config.</div>');
        });
    }

    var c = h.get('c');
    history.replaceState(null, '', location.pathname);   // tira a chave da barra de endereço
    if (c) conferir(c); else formulario('');
  })();
</script>
</body>
</html>
